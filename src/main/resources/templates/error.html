{#include fragments/layout menu='error'}
{#body}
  <img src="/resources/images/pets.png" />
  <!-- Title: Something happened -->
  <h2>{msg:somethingHappened}</h2>

  <!-- Status-specific error message (resolved by ErrorMapper: error.404 / error.500 / error.general) -->
  <p>
    <span>{statusMessage}</span>
  </p>

  <!-- Exception message (for developers) -->
  <p>{message}</p>
{/body}
{/include}
