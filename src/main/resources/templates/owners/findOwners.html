{#include fragments/layout menu='owners'}
{#body}

  <h2>{msg:findOwners}</h2>

  <form action="/owners" method="get" class="form-horizontal" id="search-owner-form">
    <div class="form-group">
      <div class="control-group" id="lastNameGroup">
        <label class="col-sm-2 control-label" for="lastName">{msg:lastName}</label>
        <div class="col-sm-10">
          <input class="form-control" id="lastName" name="lastName" value="{owner.lastName ?: ''}" size="30" maxlength="80" />
          <span class="help-inline">
            {#if errors.hasErrors()}
            <div>
              {#for err in errors.allErrors}
              <p>{err}</p>
              {/for}
            </div>
            {/if}
          </span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-primary">{msg:findOwner}</button>
      </div>
    </div>

    <a class="btn btn-primary" href="/owners/new">{msg:addOwner}</a>

  </form>

{/body}
{/include}
