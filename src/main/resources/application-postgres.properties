# database init, supports postgres too
# Activate with the "postgres" profile at BUILD time (db-kind is build-time): ./mvnw package -Dquarkus.profile=postgres
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_URL:jdbc:postgresql://localhost/petclinic}
quarkus.datasource.username=${POSTGRES_USER:petclinic}
quarkus.datasource.password=${POSTGRES_PASS:petclinic}
# SQL is written to be idempotent so this is safe
quarkus.flyway.locations=db/migration/postgres
