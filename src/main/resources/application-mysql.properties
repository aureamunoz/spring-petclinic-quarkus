# database init, supports mysql too
# Activate with the "mysql" profile at BUILD time (db-kind is build-time): ./mvnw package -Dquarkus.profile=mysql
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${MYSQL_URL:jdbc:mysql://localhost/petclinic}
quarkus.datasource.username=${MYSQL_USER:petclinic}
quarkus.datasource.password=${MYSQL_PASS:petclinic}
# SQL is written to be idempotent so this is safe
quarkus.flyway.locations=db/migration/mysql
