# Migrated from Spring Boot application.properties.
# The default database is H2 (same as the Spring app). MySQL and PostgreSQL are enabled with the
# "mysql" / "postgres" Quarkus profiles (application-mysql.properties / application-postgres.properties).
# NOTE: quarkus.datasource.db-kind is a BUILD-TIME property. To run against MySQL/PostgreSQL build with the
# profile active, e.g. ./mvnw package -Dquarkus.profile=mysql, then run with QUARKUS_PROFILE=mysql.

# Database (spring: database=h2 + embedded H2)
quarkus.datasource.db-kind=h2
# Dev/test use Dev Services (in-process H2). Prod keeps the Spring default: in-memory H2.
%prod.quarkus.datasource.jdbc.url=jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1

# Schema + data initialisation (spring.sql.init.schema-locations / data-locations / mode=always)
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration/h2
# Allows running against an existing, non-empty petclinic schema (the SQL scripts are idempotent)
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# JPA (spring.jpa.*)
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
quarkus.hibernate-orm.fetch.batch-size=16
# spring.jpa.open-in-view=false -> not applicable, Quarkus has no Open Session In View

# Internationalization (spring.messages.basename=messages/messages) is handled by
# org.springframework.samples.petclinic.system.Messages; the default locale is English like the Spring app.
quarkus.default-locale=en

# Actuator (management.endpoints.web.exposure.include=*) -> /q/health, /q/metrics are exposed by default

# Logging (logging.level.org.springframework=INFO)
quarkus.log.category."org.springframework".level=INFO

# Maximum time static resources should be cached (spring.web.resources.cache.cachecontrol.max-age=12h)
quarkus.http.static-resources.max-age=12H

# Native image: include SQL scripts and message bundles (was PetClinicRuntimeHints)
quarkus.native.resources.includes=db/**,messages/**
